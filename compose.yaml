# One command to run everything:  docker compose up --build
# Then open http://localhost:8080  (API docs: http://localhost:8000/docs)

services:
  backend:
    build: ./backend
    env_file:
      # Optional: without a .env the app runs in demo mode.
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # Completed interviews survive restarts.
      - interviews:/app/data/interviews
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  interviews:
